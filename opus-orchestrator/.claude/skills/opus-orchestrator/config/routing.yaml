# Routing settings: which model and agent handle which task.
routing:
  # Whether routing adapts to observed outcomes once enough exist.
  adaptive: true
  # Prefer the cheapest model that is expected to succeed.
  prefer_haiku: true
  # Whether a failing task may be escalated to opus.
  allow_opus_escalation: true
  # Real outcomes needed per model and complexity band before observed data replaces the heuristics.
  min_observations: 5
  # heuristic_expected_attempts are heuristics (stated guesses, not measurements) of how many
  # attempts a task of a given complexity band needs. They are replaced by observed data
  # once min_observations outcomes exist for that model and band.
  heuristic_expected_attempts:
    haiku:
      "1-2": 1.0
      "3-4": 1.2
      "5-6": 1.5
      "7-8": 2.2
      "9-10": 3.0
    sonnet:
      "1-2": 1.0
      "3-4": 1.1
      "5-6": 1.3
      "7-8": 1.7
      "9-10": 2.2
    opus:
      "1-2": 1.0
      "3-4": 1.0
      "5-6": 1.1
      "7-8": 1.3
      "9-10": 1.6
  # roles maps each logical worker role to an agent type (agent), whether it may modify
  # files (writes), and a brief that is injected into the worker prompt.
  roles:
    research-worker:
      agent: opus-researcher
      writes: false
      brief: "Investigate the question in the task and report findings with evidence such as file paths and command output. Do not modify any file and do not guess; say what you could not confirm."
    repository-worker:
      agent: opus-researcher
      writes: false
      brief: "Explore the repository and report its structure, conventions and relevant files for the task. Do not modify any file."
    implementation-worker:
      agent: opus-implementer
      writes: true
      brief: "Implement exactly the change the task describes, only inside the allowed file scope. Run the listed checks and report real results; do not touch files outside the scope."
    documentation-worker:
      agent: opus-implementer
      writes: true
      brief: "Write or update the documentation the task names, only inside the allowed file scope. State only what you verified; do not invent features, numbers or results."
    integration-worker:
      agent: opus-implementer
      writes: true
      brief: "Combine the completed pieces named in the task so they work together, fixing only the seams. Run the integration checks and report real results; do not rewrite the pieces."
    test-worker:
      agent: opus-tester
      writes: true
      brief: "Write tests for the behaviour the task describes, in the allowed test files only. Run them and report real results; do not weaken or skip existing tests."
    verification-worker:
      agent: opus-tester
      writes: true
      brief: "Run the verification commands the task lists and report exit codes and output exactly. Do not change production code to make a check pass."
    review-worker:
      agent: opus-reviewer
      writes: false
      brief: "Review the delivered work against the acceptance criteria and report defects with file and line evidence. Do not modify any file and do not approve work you did not check."
    security-worker:
      agent: opus-reviewer
      writes: false
      brief: "Review the delivered work for security problems such as secrets, unsafe commands and unsafe file access, and report each with evidence. Do not modify any file."
    debug-worker:
      agent: opus-debugger
      writes: true
      brief: "Find the root cause of the failure described in the task, reproduce it, and fix it with the smallest change inside the allowed scope. Report the evidence; do not mask the failure."
